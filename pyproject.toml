[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-forge"
version = "0.1.0"
description = "A certification authority for fuzzing harnesses. Generators are plug-ins."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Obi Ebuka David" }]
keywords = ["fuzzing", "libfuzzer", "harness", "security", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

# NO RUNTIME DEPENDENCIES, and this is a design constraint rather than an accident.
# The engine runs where the target builds — inside somebody's OSS-Fuzz image, on a CI
# runner, on an air-gapped box — and every dependency is one more thing that has to be
# present there. Everything below the surface is the standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Source = "https://github.com/eobi/harness-forge"

[project.scripts]
# hforge.cli:main, NOT hforge.__main__:main — __main__.py runs main() at import time, so
# an entry point aimed there would execute the CLI twice.
hforge = "hforge.cli:main"

[tool.setuptools.packages.find]
include = ["hforge*", "hforge_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `test` was once a DECORATOR in tests/test_java.py, and pytest collected it as a test and
# errored on a missing fixture. Collect functions only; the decorator idiom stays available.
python_functions = ["test_*"]
