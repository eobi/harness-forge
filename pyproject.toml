[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-forge"
version = "0.1.0"
description = "A certification authority for fuzzing harnesses. Generators are plug-ins."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Obi Ebuka David" }]
keywords = [
    "fuzzing", "fuzz-testing", "libfuzzer", "fuzzing-harness", "harness-generation",
    "oss-fuzz", "coverage-guided-fuzzing", "sanitizers", "addresssanitizer",
    "memory-safety", "static-analysis", "dynamic-analysis", "program-analysis",
    "security", "security-research", "vulnerability-detection", "code-generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]

# NO RUNTIME DEPENDENCIES, and this is a design constraint rather than an accident.
# The engine runs where the target builds — inside somebody's OSS-Fuzz image, on a CI
# runner, on an air-gapped box — and every dependency is one more thing that has to be
# present there. Everything below the surface is the standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/eobi/harness-forge"
Source = "https://github.com/eobi/harness-forge"
Issues = "https://github.com/eobi/harness-forge/issues"
Changelog = "https://github.com/eobi/harness-forge/commits/main"
"Benchmark results" = "https://github.com/eobi/harness-forge/blob/main/benchmarks/RANKING.md"
"Evidence and defect record" = "https://github.com/eobi/harness-forge/blob/main/docs/EVIDENCE.md"
"Platform matrix" = "https://github.com/eobi/harness-forge/blob/main/docs/PLATFORMS.md"
"Companion engine (Nemesis Forge)" = "https://github.com/eobi/nemesisforge"

[project.scripts]
# hforge.cli:main, NOT hforge.__main__:main — __main__.py runs main() at import time, so
# an entry point aimed there would execute the CLI twice.
hforge = "hforge.cli:main"

[tool.setuptools.packages.find]
include = ["hforge*", "hforge_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `test` was once a DECORATOR in tests/test_java.py, and pytest collected it as a test and
# errored on a missing fixture. Collect functions only; the decorator idiom stays available.
python_functions = ["test_*"]
